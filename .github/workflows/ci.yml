name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        package:
          - packages/crm-trust
          - packages/lifecycle-integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Verify tracked CRM Trust public sample
        if: matrix.package == 'packages/crm-trust'
        run: python -m scripts.verify_final_gate --run examples/mock_midmarket_abm_sales
      - name: Verify Lifecycle release sample end to end
        if: matrix.package == 'packages/lifecycle-integrity' && matrix.python-version == '3.12'
        run: pytest -q tests/test_lifecycle_golden.py -k scaled_mixed_motion_demo

  packaging:
    name: Build ${{ matrix.package }} wheel
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/crm-trust
          - packages/lifecycle-integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel without dependencies
        run: python -m pip wheel --no-deps . --wheel-dir /tmp/audit-wheels
