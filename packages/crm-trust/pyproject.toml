[project]
name = "hubspot-crm-trust-audit"
version = "0.1.0"
description = "B2B Growth Audit skills for read-only HubSpot CRM trust and lifecycle integrity analysis"
authors = [{ name = "Alice Ren", email = "contact@smartifymarketing.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "connectors",
    "connectors.hubspot",
    "core",
    "harness",
    "harness.providers",
    "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
